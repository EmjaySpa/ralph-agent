name: Emjay QA

# Read-only regression suite for emjaywellness.com.au.
# Runs on demand, on changes to the suite, and weekly.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (defaults to production)'
        required: false
        default: 'https://emjaywellness.com.au'
      fail_on:
        description: 'Exit-code threshold: fail | warn | never'
        required: false
        default: 'fail'
      max_pages:
        description: 'Crawl limit'
        required: false
        default: '300'
  push:
    paths:
      - 'qa/**'
      - '.github/workflows/emjay-qa.yml'
  schedule:
    # 07:00 AEST Monday (21:00 UTC Sunday).
    - cron: '0 21 * * 0'

jobs:
  selftest:
    name: Suite self-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run self-tests against the fixture site
        run: npm run selftest

  qa:
    name: QA run
    needs: selftest
    # Deliberately not run on push. This job audits the live site, so it goes
    # red whenever production has defects — which is its job, not a signal about
    # the code in the branch. Gating merges on it would make every real site
    # defect look like a broken build.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run QA suite
        id: qa
        run: |
          node src/index.mjs \
            --base-url "${{ github.event.inputs.base_url || 'https://emjaywellness.com.au' }}" \
            --max-pages "${{ github.event.inputs.max_pages || '300' }}" \
            --fail-on "${{ github.event.inputs.fail_on || 'fail' }}" \
            --out ./report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emjay-qa-report
          path: qa/report/
          retention-days: 90

      - name: Job summary
        if: always()
        run: cat report/qa-report.md >> "$GITHUB_STEP_SUMMARY" || echo 'No report produced — the crawl did not complete.' >> "$GITHUB_STEP_SUMMARY"
