# Builds the static export and deploys it to GitHub Pages.
#
# To use: in the repo, go to Settings → Pages → Source: "GitHub Actions".
# Because a Pages *project* site is served from /<repo-name>, we pass the repo
# name as NEXT_PUBLIC_BASE_PATH so assets and links resolve correctly. For a
# custom domain or a user/org root site, set BASE_PATH to an empty string.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (static export)
        env:
          # Serves from https://<user>.github.io/<repo>/ — uses the repo name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
